name: One-Click App Deployment (Azure)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, test)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test]
      action:
        description: 'Terraform action (apply, destroy, refresh)'
        required: true
        default: 'apply'
        type: choice
        options: [apply, destroy, refresh]
      app_repo_url:
        description: 'App Repository URL (e.g., https://github.com/meetpatel1111/WeatherPulse)'
        required: true
        default: 'https://github.com/meetpatel1111/WeatherPulse'
        type: string
      app_repo_branch:
        description: 'App Repository Branch'
        required: true
        default: 'main'
        type: string
      app_dockerfile:
        description: 'Dockerfile content for app (leave empty for default)'
        required: false
        default: ''
        type: string
      run_security_scan:
        description: 'Run security scans only?'
        required: false
        default: false
        type: boolean
      run_terraform:
        description: 'Run Terraform deploy?'
        required: false
        default: false
        type: boolean
      run_weather_deploy:
        description: 'Deploy Weather app?'
        required: false
        default: false
        type: boolean
      run_vote_deploy:
        description: 'Deploy Vote app?'
        required: false
        default: false
        type: boolean
      run_game_deploy:
        description: 'Deploy Game (2048) app?'
        required: false
        default: false
        type: boolean
      run_wordpress_deploy:
        description: 'Deploy WordPress (CMS) app?'
        required: false
        default: false
        type: boolean
      run_gitea_deploy:
        description: 'Deploy Gitea (Git server) app?'
        required: false
        default: false
        type: boolean

env:
  TF_DIR: terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  BACKEND_RG: tfstate-uks-shared-rg
  BACKEND_SA: sttfstateshared
  BACKEND_CONTAINER: tfstate
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

jobs:
  security-scan:
    if: ${{ github.event.inputs.run_security_scan == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Run tfsec (IaC)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_DIR }}
          format: csv
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan on base images
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: node:18-alpine
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  terraform-k8s:
    if: github.event.inputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register Azure Providers
        run: |
          echo "Registering all required Azure providers..."
          az provider register --namespace Microsoft.ContainerService --wait
          az provider register --namespace Microsoft.Network --wait
          az provider register --namespace Microsoft.Compute --wait
          az provider register --namespace Microsoft.Storage --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait

          echo "Ensuring provider registration is complete..."
          az provider register --namespace Microsoft.ContainerService --wait || true

          echo "Checking provider registration status..."
          az provider show --namespace Microsoft.ContainerService --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Network --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Compute --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Storage --query "registrationState" -o tsv
          az provider show --namespace Microsoft.ContainerRegistry --query "registrationState" -o tsv

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Clean Terraform Cache
        run: |
          cd terraform
          rm -rf .terraform
          rm -f terraform.lock.hcl
          echo "Terraform cache cleaned"

      - name: Set ENV
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "TFVARS_FILE=${{ github.event.inputs.environment }}.tfvars" >> $GITHUB_ENV

      - name: Pre-bootstrap Terraform backend
        run: |
          chmod +x ./terraform/bootstrap/prebootstrap.sh
          ./terraform/bootstrap/prebootstrap.sh \
            "${BACKEND_RG}" \
            "${BACKEND_SA}" \
            "${BACKEND_CONTAINER}" \
            "eastus"

      - name: Terraform Init (Remote azurerm Backend - shared SA)
        run: |
          set -euo pipefail
          cd "${TF_DIR}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          RG_NAME="${BACKEND_RG}"
          SA_NAME="${BACKEND_SA}"
          CONTAINER_NAME="${BACKEND_CONTAINER}"
          KEY_PATH="aks/${ENVIRONMENT}.tfstate"

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${RG_NAME}" \
            -backend-config="storage_account_name=${SA_NAME}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${KEY_PATH}"

      - name: Terraform Fmt
        run: |
          cd "${TF_DIR}"
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd "${TF_DIR}"
          terraform validate

      - name: Execute Terraform
        run: |
          cd "${TF_DIR}"
          ACTION="${{ github.event.inputs.action }}"
          case "$ACTION" in
            apply)
              terraform plan -input=false -var-file="$TFVARS_FILE" -out=tfplan
              terraform apply -input=false -auto-approve tfplan
              ;;
            destroy)
              terraform plan -destroy -input=false -var-file="$TFVARS_FILE" -out=tfplan-destroy
              terraform apply -input=false -auto-approve tfplan-destroy
              ;;
            refresh)
              terraform refresh -input=false -var-file="$TFVARS_FILE"
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac

  weather-app-deploy:
    if: ${{ github.event.inputs.run_weather_deploy == 'true' || github.event.inputs.run_vote_deploy == 'true' || github.event.inputs.run_game_deploy == 'true' || github.event.inputs.run_wordpress_deploy == 'true' || github.event.inputs.run_gitea_deploy == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register Azure Providers
        run: |
          echo "Registering all required Azure providers..."
          az provider register --namespace Microsoft.ContainerService --wait
          az provider register --namespace Microsoft.Network --wait
          az provider register --namespace Microsoft.Compute --wait
          az provider register --namespace Microsoft.Storage --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait

          echo "Ensuring provider registration is complete..."
          az provider register --namespace Microsoft.ContainerService --wait || true

          echo "Checking provider registration status..."
          az provider show --namespace Microsoft.ContainerService --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Network --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Compute --query "registrationState" -o tsv
          az provider show --namespace Microsoft.Storage --query "registrationState" -o tsv
          az provider show --namespace Microsoft.ContainerRegistry --query "registrationState" -o tsv

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Clean Terraform Cache
        run: |
          cd terraform
          rm -rf .terraform
          rm -f terraform.lock.hcl
          echo "Terraform cache cleaned"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Verify kubectl version
        run: kubectl version --client

      # ---------- read TF outputs & get kubeconfig ----------
      - name: Terraform Init (for reading outputs) - shared backend
        run: |
          cd "${TF_DIR}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          RG_NAME="${BACKEND_RG}"
          SA_NAME="${BACKEND_SA}"
          CONTAINER_NAME="${BACKEND_CONTAINER}"
          KEY_PATH="aks/${ENVIRONMENT}.tfstate"

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${RG_NAME}" \
            -backend-config="storage_account_name=${SA_NAME}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${KEY_PATH}"

      - name: Get AKS kubeconfig
        run: |
          RG_NAME=$(terraform -chdir="${TF_DIR}" output -raw resource_group_name)
          CLUSTER_NAME=$(terraform -chdir="${TF_DIR}" output -raw cluster_name)
          az aks get-credentials -g "$RG_NAME" -n "$CLUSTER_NAME" --overwrite-existing

      # ---------- ACR login & build/push ----------
      - name: Fetch ACR outputs & login
        run: |
          ACR_NAME=$(terraform -chdir="${TF_DIR}" output -raw acr_name)
          ACR_SERVER=$(terraform -chdir="${TF_DIR}" output -raw acr_login_server)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV
          az acr login --name "$ACR_NAME"

      - name: Build & Push App Image (ACR)
        if: ${{ github.event.inputs.run_weather_deploy == 'true' }}
        run: |
          TAG="${{ github.event.inputs.environment }}"
          APP_IMAGE="${ACR_SERVER}/app:${TAG}"
          echo "APP_IMAGE=$APP_IMAGE" >> $GITHUB_ENV

          # Clone app repository
          git clone ${{ github.event.inputs.app_repo_url }}
          REPO_NAME=$(basename "${{ github.event.inputs.app_repo_url }}" .git)
          cd "$REPO_NAME"

          # Checkout specific branch if provided
          if [ "${{ github.event.inputs.app_repo_branch }}" != "main" ]; then
            git checkout "${{ github.event.inputs.app_repo_branch }}"
          fi

          # Create Dockerfile
          if [ -n "${{ github.event.inputs.app_dockerfile }}" ]; then
            echo "${{ github.event.inputs.app_dockerfile }}" > Dockerfile
          else
            if [ ! -f "Dockerfile" ]; then
              printf "FROM nginx:alpine\nCOPY index.html /usr/share/nginx/html/\nCOPY script.js /usr/share/nginx/html/\nCOPY styles.css /usr/share/nginx/html/\nRUN echo 'server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files \$uri \$uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf\nEXPOSE 80\nCMD [\"nginx\", \"-g\", \"daemon off;\"]\n" > Dockerfile
            fi
          fi

          # Build and push app image
          docker build --no-cache -t "$APP_IMAGE" .
          docker push "$APP_IMAGE"

      - name: Run Trivy scan on app
        if: ${{ github.event.inputs.run_security_scan == 'true' && github.event.inputs.run_weather_deploy == 'true' }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.APP_IMAGE }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}

      - name: Create Kubernetes Secrets
        if: ${{ github.event.inputs.run_weather_deploy == 'true' }}
        run: |
          kubectl create secret generic weather-app-secret \
            --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --from-literal=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --from-literal=OPEN_METEO_API_KEY=${{ secrets.OPEN_METEO_API_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Export replicas and HPA settings from TFVARS
        run: |
          TFVARS_FILE="${{ github.event.inputs.environment }}.tfvars"
          ENVFILE="${TF_DIR}/${TFVARS_FILE}"
          export WEATHER_APP_REPLICAS=$(grep -E '^\s*weather_app_replicas\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "2")
          export WEATHER_APP_HPA_MAX=$(grep -E '^\s*weather_app_hpa_max\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "5")
          export VOTE_REPLICAS=$(grep -E '^\s*vote_app_replicas\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "2")
          export VOTE_HPA_MAX=$(grep -E '^\s*vote_app_hpa_max\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "5")
          export GAME_REPLICAS=$(grep -E '^\s*game_app_replicas\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "1")
          export GAME_HPA_MAX=$(grep -E '^\s*game_app_hpa_max\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "3")
          export WORDPRESS_REPLICAS=$(grep -E '^\s*wordpress_app_replicas\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "1")
          export WORDPRESS_HPA_MAX=$(grep -E '^\s*wordpress_app_hpa_max\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "3")
          export GITEA_REPLICAS=$(grep -E '^\s*gitea_app_replicas\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "1")
          export GITEA_HPA_MAX=$(grep -E '^\s*gitea_app_hpa_max\s*=' "$ENVFILE" | awk -F'=' '{print $2}' | xargs || echo "3")

          echo "WEATHER_APP_REPLICAS_MIN=$WEATHER_APP_REPLICAS" >> $GITHUB_ENV
          echo "WEATHER_APP_REPLICAS_MAX=$WEATHER_APP_HPA_MAX" >> $GITHUB_ENV
          echo "VOTE_REPLICAS_MIN=$VOTE_REPLICAS" >> $GITHUB_ENV
          echo "VOTE_REPLICAS_MAX=$VOTE_HPA_MAX" >> $GITHUB_ENV
          echo "GAME_REPLICAS_MIN=$GAME_REPLICAS" >> $GITHUB_ENV
          echo "GAME_REPLICAS_MAX=$GAME_HPA_MAX" >> $GITHUB_ENV
          echo "WORDPRESS_REPLICAS_MIN=$WORDPRESS_REPLICAS" >> $GITHUB_ENV
          echo "WORDPRESS_REPLICAS_MAX=$WORDPRESS_HPA_MAX" >> $GITHUB_ENV
          echo "GITEA_REPLICAS_MIN=$GITEA_REPLICAS" >> $GITHUB_ENV
          echo "GITEA_REPLICAS_MAX=$GITEA_HPA_MAX" >> $GITHUB_ENV

      - name: Apply Kubernetes Deployments & Services (Azure)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.0/deploy/static/provider/cloud/deploy.yaml

          echo "=== Checking ingress-nginx pod status ==="
          kubectl get pods -n ingress-nginx -o wide
          kubectl describe pods -n ingress-nginx -l app.kubernetes.io/component=controller

          kubectl wait --namespace ingress-nginx \
              --for=condition=ready pod \
              --selector=app.kubernetes.io/component=controller \
              --timeout=600s || echo "Warning: ingress-nginx controller not ready, continuing for debugging..."

          echo "=== ingress-nginx controller logs ==="
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50 || true

          ENVIRONMENT="${{ github.event.inputs.environment }}"

          # Wait for the ingress-nginx Service LoadBalancer IP (or hostname)
          echo "Waiting for ingress-nginx controller LoadBalancer IP..."
          LB_SVC_NS=ingress-nginx
          LB_SVC_NAME=ingress-nginx-controller
          MAX_ATTEMPTS=30
          SLEEP_SECS=10
          EXTERNAL_IP=""

          for i in $(seq 1 $MAX_ATTEMPTS); do
            EXTERNAL_IP=$(kubectl -n $LB_SVC_NS get svc $LB_SVC_NAME -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -z "$EXTERNAL_IP" ]; then
              EXTERNAL_IP=$(kubectl -n $LB_SVC_NS get svc $LB_SVC_NAME -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            fi

            if [ -n "$EXTERNAL_IP" ]; then
              echo "Found ingress controller LB: $EXTERNAL_IP"
              break
            fi

            echo "Attempt $i/$MAX_ATTEMPTS - LB IP not yet assigned. Sleeping ${SLEEP_SECS}s..."
            sleep $SLEEP_SECS
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "ERROR: ingress controller LoadBalancer IP/hostname was not assigned within timeout."
            echo "Check: kubectl -n $LB_SVC_NS get svc $LB_SVC_NAME -o wide"
            exit 1
          fi

          # Convert IP to nip.io compatible format
          EXTERNAL_IP_DASHED=$(echo $EXTERNAL_IP | sed 's/\./-/g')

          export EXTERNAL_IP=$EXTERNAL_IP_DASHED
          echo "EXTERNAL_IP=$EXTERNAL_IP_DASHED" >> $GITHUB_ENV

          echo "Converted IP for nip.io: $EXTERNAL_IP"

          # Render & apply application manifests with envsubst
          export WEATHER_APP_REPLICAS_MIN="${WEATHER_APP_REPLICAS_MIN:-2}"
          export WEATHER_APP_REPLICAS_MAX="${WEATHER_APP_REPLICAS_MAX:-5}"
          export VOTE_REPLICAS_MIN="${VOTE_REPLICAS_MIN:-2}"
          export VOTE_REPLICAS_MAX="${VOTE_REPLICAS_MAX:-5}"
          export GAME_REPLICAS_MIN="${GAME_REPLICAS_MIN:-1}"
          export GAME_REPLICAS_MAX="${GAME_REPLICAS_MAX:-3}"
          export WORDPRESS_REPLICAS_MIN="${WORDPRESS_REPLICAS_MIN:-1}"
          export WORDPRESS_REPLICAS_MAX="${WORDPRESS_REPLICAS_MAX:-3}"
          export GITEA_REPLICAS_MIN="${GITEA_REPLICAS_MIN:-1}"
          export GITEA_REPLICAS_MAX="${GITEA_REPLICAS_MAX:-3}"

          # Deploy weather app if selected
          if [ "${{ github.event.inputs.run_weather_deploy }}" == "true" ]; then
            echo "Deploying weather app..."
            cp k8s/app-deployment.yaml k8s/temp.yaml && envsubst < k8s/temp.yaml > k8s/app-deployment.yaml && rm k8s/temp.yaml && kubectl apply -f k8s/app-deployment.yaml
            kubectl -n default rollout status deployment/app --timeout=180s || echo "app rollout timed out (continuing)"
          fi

          # Deploy vote app if selected
          if [ "${{ github.event.inputs.run_vote_deploy }}" == "true" ]; then
            echo "Deploying vote app..."
            cp k8s/vote-deployment.yaml k8s/temp.yaml && envsubst < k8s/temp.yaml > k8s/vote-deployment.yaml && rm k8s/temp.yaml && kubectl apply -f k8s/vote-deployment.yaml
            kubectl -n default rollout status deployment/vote-front --timeout=180s || echo "vote-front rollout timed out (continuing)"
            kubectl -n default rollout status deployment/vote-back --timeout=120s || echo "vote-back rollout timed out (continuing)"
          fi

          # Deploy game app if selected
          if [ "${{ github.event.inputs.run_game_deploy }}" == "true" ]; then
            echo "Deploying game app..."
            cp k8s/game-deployment.yaml k8s/temp.yaml && envsubst < k8s/temp.yaml > k8s/game-deployment.yaml && rm k8s/temp.yaml && kubectl apply -f k8s/game-deployment.yaml
            kubectl -n default rollout status deployment/game --timeout=180s || echo "game rollout timed out (continuing)"
          fi

          # Deploy wordpress app if selected
          if [ "${{ github.event.inputs.run_wordpress_deploy }}" == "true" ]; then
            echo "Deploying wordpress app..."
            cp k8s/wordpress-deployment.yaml k8s/temp.yaml && envsubst < k8s/temp.yaml > k8s/wordpress-deployment.yaml && rm k8s/temp.yaml && kubectl apply -f k8s/wordpress-deployment.yaml
            kubectl -n default rollout status deployment/mysql --timeout=180s || echo "mysql rollout timed out (continuing)"
            kubectl -n default rollout status deployment/wordpress --timeout=180s || echo "wordpress rollout timed out (continuing)"
          fi

          # Deploy gitea app if selected
          if [ "${{ github.event.inputs.run_gitea_deploy }}" == "true" ]; then
            echo "Deploying gitea app..."
            cp k8s/gitea-deployment.yaml k8s/temp.yaml && envsubst < k8s/temp.yaml > k8s/gitea-deployment.yaml && rm k8s/temp.yaml && kubectl apply -f k8s/gitea-deployment.yaml
            kubectl -n default rollout status deployment/gitea-db --timeout=180s || echo "gitea-db rollout timed out (continuing)"
            kubectl -n default rollout status deployment/gitea --timeout=180s || echo "gitea rollout timed out (continuing)"
          fi

          # Always apply ingress (needed for any selected app)
          envsubst < k8s/main-ingress.yaml > k8s/main-ingress-final.yaml
          kubectl apply -f k8s/main-ingress-final.yaml

      - name: Wait for LoadBalancer IP
        run: |
          echo "Waiting for ingress-nginx LoadBalancer IP..."
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$EXTERNAL_IP" ]; then
              echo "Found ingress IP: $EXTERNAL_IP"
              break
            fi
            echo "Attempt $i/30 - LB IP not yet assigned. Sleeping 10s..."
            sleep 10
          done

      - name: Verify Deployments
        run: |
          echo "=== Default Namespace Status ==="
          kubectl -n default get deployments -o wide
          kubectl -n default get pods -o wide
          kubectl -n default get services
          kubectl -n default get ingress

          echo "=== Events in default namespace ==="
          kubectl -n default get events --sort-by=.lastTimestamp | tail -20

          EXTERNAL_IP=$(echo $EXTERNAL_IP | sed 's/\./-/g')

          echo "=== Access Information ==="
          [ "${{ github.event.inputs.run_weather_deploy }}" == "true" ] && echo "Weather App: http://app.${EXTERNAL_IP}.nip.io"
          [ "${{ github.event.inputs.run_vote_deploy }}" == "true" ] && echo "Vote App: http://vote.${EXTERNAL_IP}.nip.io"
          [ "${{ github.event.inputs.run_game_deploy }}" == "true" ] && echo "Game (2048): http://game.${EXTERNAL_IP}.nip.io"
          [ "${{ github.event.inputs.run_wordpress_deploy }}" == "true" ] && echo "WordPress: http://wordpress.${EXTERNAL_IP}.nip.io"
          [ "${{ github.event.inputs.run_gitea_deploy }}" == "true" ] && echo "Gitea: http://gitea.${EXTERNAL_IP}.nip.io"

      - name: Test App Health
        run: |
          EXTERNAL_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          EXTERNAL_IP=$(echo $EXTERNAL_IP | sed 's/\./-/g')
          [ "${{ github.event.inputs.run_weather_deploy }}" == "true" ] && echo "Testing weather app..." && curl -f "http://app.${EXTERNAL_IP}.nip.io/" || exit 1
          [ "${{ github.event.inputs.run_vote_deploy }}" == "true" ] && echo "Testing vote app..." && curl -f "http://vote.${EXTERNAL_IP}.nip.io/" || exit 1
          [ "${{ github.event.inputs.run_game_deploy }}" == "true" ] && echo "Testing game app..." && curl -f "http://game.${EXTERNAL_IP}.nip.io/" || exit 1
          [ "${{ github.event.inputs.run_wordpress_deploy }}" == "true" ] && echo "Testing wordpress app..." && curl -f "http://wordpress.${EXTERNAL_IP}.nip.io/wp-login.php" || exit 1
          [ "${{ github.event.inputs.run_gitea_deploy }}" == "true" ] && echo "Testing gitea app..." && curl -f "http://gitea.${EXTERNAL_IP}.nip.io/" || exit 1

  verify-deployment:
    if: always() && (needs.weather-app-deploy.result == 'success')
    needs: [weather-app-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Terraform Init (for reading outputs) - shared backend
        run: |
          cd "${TF_DIR}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          RG_NAME="${BACKEND_RG}"
          SA_NAME="${BACKEND_SA}"
          CONTAINER_NAME="${BACKEND_CONTAINER}"
          KEY_PATH="aks/${ENVIRONMENT}.tfstate"

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${RG_NAME}" \
            -backend-config="storage_account_name=${SA_NAME}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${KEY_PATH}"

      - name: Get AKS kubeconfig
        run: |
          RG_NAME=$(terraform -chdir="${TF_DIR}" output -raw resource_group_name)
          CLUSTER_NAME=$(terraform -chdir="${TF_DIR}" output -raw cluster_name)
          az aks get-credentials -g "$RG_NAME" -n "$CLUSTER_NAME" --overwrite-existing

      - name: Verify Kubernetes Deployments & Services
        run: |
          kubectl get nodes -o wide
          kubectl get deployments -A
          kubectl get svc -A
          kubectl get ingress -A
          kubectl get hpa -A
